<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图像对比实验 · Image comparison study</title>
<style>
  :root { --accent: #2457c5; --accent-dark: #1b438f; --ok: #0f7a3b; --bad: #b3261e; --warn-bg: #fff4e5; --ok-bg: #e8f5ec;
          --bad-bg: #fdecea; --ink: #1d1d1f; --muted: #5f6368; --line: #dadce0; --page: #eef1f5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink);
               font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .screen { display: none; }
  .screen.on { display: block; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  .card { background: #fff; border-radius: 14px; padding: 30px 36px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 18px rgba(0,0,0,.05); }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h2 { font-size: 19px; margin: 22px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 17px; }
  .steps { color: var(--muted); font-size: 13px; letter-spacing: .02em; margin-bottom: 10px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
  .fact { background: #f6f8fb; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .fact b { display: block; margin-bottom: 2px; }
  .btn { display: inline-block; font: inherit; font-size: 17px; padding: 11px 26px; border-radius: 10px; border: 0; cursor: pointer;
         background: var(--accent); color: #fff; margin: 8px 10px 0 0; text-decoration: none; }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { background: #b8c2d6; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.ghost:hover { background: #f1f5ff; }
  .btn.small { font-size: 14px; padding: 7px 14px; }
  a { color: var(--accent); }
  select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  textarea { width: 100%; min-height: 70px; }
  label.chk { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; cursor: pointer; }
  label.chk input { width: 20px; height: 20px; margin-top: 3px; }
  .q { display: grid; grid-template-columns: 230px 1fr; gap: 10px 14px; align-items: center; margin: 14px 0; }
  .idrow { margin: 18px 0 6px; }
  .idrow input { font-size: 18px; padding: 9px 12px; width: 100%; max-width: 440px; border: 1px solid #c3ccd8; border-radius: 8px; margin: 6px 0; }
  .note { background: #f6f8fb; border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin: 14px 0; color: #333; }
  .warnbox { background: var(--warn-bg); border-left: 4px solid #e8a33d; padding: 10px 14px; border-radius: 6px; margin: 14px 0; }
  .check { display: flex; gap: 14px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .check .dot { flex: 0 0 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                font-weight: 700; color: #fff; background: var(--bad); font-size: 18px; }
  .check.pass { background: var(--ok-bg); border-color: #b7dfc3; }
  .check.pass .dot { background: var(--ok); }
  .check.fail { background: var(--bad-bg); border-color: #f3c1bd; }
  .check .val { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .topbar { display: flex; justify-content: flex-end; padding: 10px 16px 0; max-width: 860px; margin: 0 auto; }
  .langbtn { font: inherit; font-size: 14px; background: none; border: 1px solid var(--line); border-radius: 18px; padding: 4px 12px; cursor: pointer; color: var(--muted); }
  kbd { display: inline-block; min-width: 26px; text-align: center; background: #f3f4f6; border: 1px solid #c4c7cc; border-bottom-width: 3px;
        border-radius: 6px; padding: 1px 7px; font: 600 15px ui-monospace, Menlo, Consolas, monospace; color: #222; }
  .demo { background: #808080; border-radius: 10px; padding: 14px 16px 6px; margin: 16px 0 8px; }
  .demo .row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .demo .lab { width: 150px; color: #fff; font-size: 15px; text-align: right; }
  .demo img { width: 250px; height: 160px; border-radius: 3px; display: block; }
  .demo .cap { color: #f0f0f0; font-size: 13px; text-align: center; margin-top: 2px; }
  @media (max-width: 760px) { .demo .lab { width: 100%; text-align: center; } }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
  .key { border: 2px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; transition: all .15s; }
  .key.done { border-color: var(--ok); background: var(--ok-bg); }
  .key .big { font-size: 26px; margin-bottom: 4px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .hidden { display: none !important; }
  /* trial screen: neutral grey, nothing else */
  #s-trial { position: fixed; inset: 0; background: #808080; }
  #stage { position: absolute; inset: 0 0 46px 0; display: flex; align-items: center; justify-content: center; gap: 16px; }
  #stage img { display: block; }
  #mask { position: absolute; inset: 0; background: #808080; display: none; align-items: center; justify-content: center; color: #e6e6e6; font-size: 18px; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: center; justify-content: center; gap: 22px;
         color: #1f1f1f; font-size: 14px; }
  #bar { width: 220px; height: 8px; background: #6c6c6c; border-radius: 4px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #d9d9d9; }
  #fb { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); padding: 8px 18px; border-radius: 20px; font-size: 17px; display: none; color: #fff; }
  #fb.good { background: var(--ok); }
  #fb.bad { background: #b85c00; }
  #pause { position: fixed; inset: 0; background: rgba(40,40,40,.92); display: none; align-items: center; justify-content: center; z-index: 9; }
  #pause .card { max-width: 560px; }
  @media (max-width: 700px) { .facts, .keys { grid-template-columns: 1fr; } .q { grid-template-columns: 1fr; } .card { padding: 22px; } }
</style>
<script src="config.js"></script>
<script src="trials.js"></script>
</head>
<body>

<div class="topbar" id="topbar"><button class="langbtn" id="langbtn">English</button></div>

<!-- 1. welcome -->
<section id="s-welcome" class="screen on"><div class="wrap"><div class="card">
  <h1 data-t="w_title"></h1>
  <p class="sub" data-t="w_sub"></p>
  <div class="facts">
    <div class="fact" data-t="w_f1"></div><div class="fact" data-t="w_f2"></div>
    <div class="fact" data-t="w_f3"></div><div class="fact" data-t="w_f4"></div>
  </div>
  <div class="idrow"><label for="pid"><b data-t="w_id"></b></label><br>
    <input id="pid" type="text" maxlength="60" autocomplete="off" spellcheck="false">
    <div class="small muted" data-t="w_id_note"></div></div>
  <div id="resumebox" class="note hidden"></div>
  <p>
    <button class="btn" id="b-start"></button>
    <button class="btn ghost hidden" id="b-resume"></button>
    <button class="btn ghost hidden" id="b-restart"></button>
  </p>
  <p class="small muted"><span data-t="w_guide"></span> <a href="guide.html" target="_blank" data-t="w_guide_link"></a></p>
</div></div></section>

<!-- 2. consent -->
<section id="s-consent" class="screen"><div class="wrap"><div class="card">
  <div class="steps" data-t="step1"></div>
  <h1 data-t="c_title"></h1>
  <div id="consenttext"></div>
  <label class="chk"><input type="checkbox" id="c1"><span data-t="c_agree"></span></label>
  <label class="chk"><input type="checkbox" id="c2"><span data-t="c_adult"></span></label>
  <button class="btn" id="b-consent" disabled></button>
</div></div></section>

<!-- 3. about -->
<section id="s-about" class="screen"><div class="wrap"><div class="card">
  <div class="steps" data-t="step2"></div>
  <h1 data-t="a_title"></h1>
  <p class="muted" data-t="a_note"></p>
  <div class="q"><span data-t="a_age"></span><select id="q-age"></select></div>
  <div class="q"><span data-t="a_vision"></span><select id="q-vision"></select></div>
  <div class="q"><span data-t="a_exp"></span><select id="q-exp"></select></div>
  <div class="q"><span data-t="a_disp"></span><select id="q-disp"></select></div>
  <button class="btn" id="b-about"></button>
</div></div></section>

<!-- 4. display check -->
<section id="s-display" class="screen"><div class="wrap"><div class="card">
  <div class="steps" data-t="step3"></div>
  <h1 data-t="d_title"></h1>
  <p data-t="d_intro"></p>
  <div class="check" id="chk1"><div class="dot">1</div><div><b data-t="d_c1"></b><div id="chk1txt"></div></div></div>
  <div class="check" id="chk2"><div class="dot">2</div><div><b data-t="d_c2"></b><div id="chk2txt"></div></div></div>
  <div class="note" data-t="d_tips"></div>
  <button class="btn ghost" id="b-full"></button>
  <button class="btn" id="b-display" disabled></button>
</div></div></section>

<!-- 5. how to -->
<section id="s-howto" class="screen"><div class="wrap"><div class="card">
  <div class="steps" data-t="step4"></div>
  <h1 data-t="h_title"></h1>
  <p data-t="h_p1"></p>
  <div class="demo">
    <div class="row"><div class="lab" data-t="h_row1"></div>
      <div><img src="img/demo_L.png" alt=""><div class="cap" data-t="h_left"></div></div>
      <div><img src="img/demo_R.png" alt=""><div class="cap" data-t="h_right"></div></div></div>
    <div class="row"><div class="lab" data-t="h_row2"></div>
      <div><img src="img/demo_O.png" alt=""><div class="cap" data-t="h_orig"></div></div>
      <div><img src="img/demo_O.png" alt=""><div class="cap" data-t="h_orig"></div></div></div>
  </div>
  <p class="small muted" data-t="h_demo_note"></p>
  <p data-t="h_p2"></p>
  <div class="warnbox" data-t="h_tip"></div>
  <h2 data-t="h_try"></h2>
  <div class="keys">
    <div class="key" id="k-F"><div class="big"><kbd>F</kbd></div><span data-t="h_kF"></span></div>
    <div class="key" id="k-J"><div class="big"><kbd>J</kbd></div><span data-t="h_kJ"></span></div>
    <div class="key" id="k-S"><div class="big"><kbd>␣ Space</kbd></div><span data-t="h_kS"></span></div>
  </div>
  <button class="btn" id="b-howto" disabled></button>
</div></div></section>

<!-- generic message -->
<section id="s-msg" class="screen"><div class="wrap"><div class="card"><div id="msg"></div>
  <p><button class="btn" id="b-msg"></button><button class="btn ghost hidden" id="b-msg2"></button></p></div></div></section>

<!-- trials -->
<section id="s-trial" class="screen">
  <div id="stage"><img id="imL" alt=""><img id="imR" alt=""></div>
  <div id="mask"></div>
  <div id="fb"></div>
  <div id="hud"><span id="prog"></span><span id="bar"><i id="barfill"></i></span><span id="hint"></span></div>
</section>

<!-- end -->
<section id="s-end" class="screen"><div class="wrap"><div class="card">
  <h1 data-t="e_title"></h1>
  <p id="endsum"></p>
  <h2 data-t="e_comment"></h2>
  <textarea id="comment"></textarea>
  <p><button class="btn" id="b-submit"></button><button class="btn ghost hidden" id="b-again"></button></p>
  <div id="sendinfo" class="hidden"></div>
  <p class="small muted" data-t="e_kept"></p>
</div></div></section>

<!-- phone / tablet -->
<section id="s-mobile" class="screen"><div class="wrap"><div class="card">
  <h1 data-t="m_title"></h1><p data-t="m_text"></p>
</div></div></section>

<div id="pause"><div class="card"><h1 data-t="p_title"></h1><p id="pausetxt"></p><button class="btn" id="b-pause"></button></div></div>

<script>

  // ------------------------------------------------------------------ texts

      w_id: '你的名字、昵称或邮箱', w_id_ph: '例如：张三 或 zhangsan@example.com', w_id_note: '只用来区分谁交了结果，不会公开。以后在同一台电脑上填同样的名字，可以接着做。',
      w_start: '开始', w_resume: '继续上次', w_restart: '重新开始', w_review: '查看结果 / 再次下载',

      c_title: '参与说明',

        '<p><b>风险</b>　和平时看电脑屏幕一样，没有额外风险。眼睛累了可以在休息时多歇一会儿。</p>' +

  function preload(tr) { if (!tr) return; [tr.L, tr.R, tr.ref].forEach(id => { if (!cache[id]) { const im = new Image(); im.src = src(id); cache[id] = im; } }); }
  function sizeImg(img, id) { const wh = S.sizes[id]; img.style.width = (wh[0] / dpr()) + 'px'; img.style.height = (wh[1] / dpr()) + 'px'; }
  function run(trials, kind, cb) { list = trials; idx = 0; phase = kind; doneCb = cb; startDpr = dpr(); show('s-trial'); next(); }
  function next() {
    if (idx >= list.length) { phase = 'idle'; doneCb(); return; }
    if (phase === 'main' && state.responses.length > 0 && state.responses.length % S.break_every === 0 && list[idx]._brk !== true) {
      list[idx]._brk = true;
      const N = S.participants[state.set].length, n = state.responses.length;
      const rts = state.responses.map(r => r.rt).filter(x => x > 0);
      const avg = rts.length ? rts.reduce((a, b) => a + b, 0) / rts.length + 400 : 5000;
      phase = 'break';
      message(L('brk')(n, N, Math.max(1, Math.round((N - n) * avg / 60000))), L('brk_go'), () => { phase = 'main'; show('s-trial'); next(); });
      return;
    }
    const tr = list[idx];
    for (let k = 1; k <= 3; k++) preload(list[idx + k]);
    preload(tr);
    locked = true;
    $('mask').style.display = 'flex'; $('mask').textContent = '';
    clearTimeout(loadTimer); loadTimer = setTimeout(() => { $('mask').textContent = L('loading'); }, 400);
    const iL = $('imL'), iR = $('imR');
    sizeImg(iL, tr.L); sizeImg(iR, tr.R);
    const ready = () => Promise.all([cache[tr.L], cache[tr.R], cache[tr.ref]].map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve()));
    ready().then(() => {
      if (list[idx] !== tr) return;
      iL.src = src(tr.L); iR.src = src(tr.R);
      clearTimeout(loadTimer); $('mask').style.display = 'none';
      onset = performance.now(); refViews = 0; refMs = 0; refDown = 0; locked = paused;
    });
    const N = list.length;
    $('prog').textContent = (phase === 'practice' ? L('hud_practice') : '') + (phase === 'main' ? state.responses.length + 1 : idx + 1) + ' / ' +
                            (phase === 'main' ? S.participants[state.set].length : N);
    $('barfill').style.width = (phase === 'main' ? 100 * state.responses.length / S.participants[state.set].length : 100 * idx / N) + '%';
    $('hint').textContent = L('hud_hint');
  }
  function showRef(on) { const tr = list[idx]; if (!tr) return; $('imL').src = src(on ? tr.ref : tr.L); $('imR').src = src(on ? tr.ref : tr.R); }
  function answer(side) {
    const tr = list[idx], t = performance.now();
    if (t - onset < 250) return;                               // a key still held from the last trial
    if (refDown) { refMs += t - refDown; refDown = 0; showRef(false); }
    const rec = { t: tr.t, c: tr.c, L: tr.L, R: tr.R, choice: side, chosen: side === 'L' ? tr.L : tr.R, rt: Math.round(t - onset),
                  ref_views: refViews, ref_ms: Math.round(refMs), dpr: dpr(), at: new Date().toISOString() };
    if (tr.expect) rec.correct = rec.chosen === tr.expect;
    locked = true;
    if (phase === 'practice') {
      state.practice.push(rec); save();
      const fb = $('fb');
      fb.className = rec.correct ? 'good' : 'bad';
      fb.textContent = rec.correct ? L('fb_good') : (tr.expect === tr.L ? L('fb_bad_L') : L('fb_bad_R'));
      fb.style.display = 'block';
      setTimeout(() => { fb.style.display = 'none'; idx += 1; $('mask').style.display = 'flex'; setTimeout(next, 300); }, 900);
      return;
    }
    state.responses.push(rec); save();
    idx += 1;
    $('mask').style.display = 'flex'; $('mask').textContent = '';
    setTimeout(next, 350);
  }
  function guardTrial() {
    if (!$('s-trial').classList.contains('on') || (phase !== 'main' && phase !== 'practice')) return;
    const okNow = bigEnough() && intDpr() && Math.abs(dpr() - startDpr) < 0.01;
    if (!okNow && !paused) {
      paused = true; locked = true;
      if (refDown) { refDown = 0; showRef(false); }
      state.events.push({ type: 'pause', at: new Date().toISOString(), dpr: dpr(), dev_w: devW(), dev_h: devH() }); save();
      $('pausetxt').innerHTML = Math.abs(dpr() - startDpr) >= 0.01 ? L('p_zoom') : L('p_small');
      $('pause').style.display = 'flex';
    }
  }
  $('b-pause').onclick = () => {
    full();
    setTimeout(() => {
      if (!(bigEnough() && intDpr() && Math.abs(dpr() - startDpr) < 0.01)) { $('pausetxt').innerHTML = Math.abs(dpr() - startDpr) >= 0.01 ? L('p_zoom') : L('p_small'); return; }
      paused = false; $('pause').style.display = 'none'; next();                // show the same trial again, timing restarts
    }, 450);
  };
  document.addEventListener('keydown', (e) => {
    if (!$('s-trial').classList.contains('on') || (phase !== 'main' && phase !== 'practice')) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat && !locked && !refDown) { refDown = performance.now(); refViews += 1; showRef(true); } return; }
    if (e.repeat || locked) return;
    if (e.code === 'KeyF') answer('L'); else if (e.code === 'KeyJ') answer('R');
  });
  document.addEventListener('keyup', (e) => { if (e.code === 'Space' && refDown) { refMs += performance.now() - refDown; refDown = 0; showRef(false); } });
  window.addEventListener('blur', () => { if (refDown) { refMs += performance.now() - refDown; refDown = 0; showRef(false); } });

  // ------------------------------------------------------------------ end
  function finish() {
    state.finished = new Date().toISOString(); save();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    showEnd();
  }
  function showEnd() {
    const chk = state.responses.filter(r => r.c === 'check');
    $('endsum').innerHTML = L('e_sum')(esc(state.pid || state.set), state.responses.length, chk.filter(r => r.correct).length, chk.length);
    $('comment').value = state.comment || '';
    $('sendinfo').classList.add('hidden');
    $('b-again').classList.toggle('hidden', !state.submitted);
    show('s-end');
  }
  function download() {
    const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'image_study_' + fileSafe(state.pid) + '_' + state.started.replace(/[:.]/g, '-') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  $('b-submit').onclick = () => {
    state.comment = $('comment').value.slice(0, 2000); state.submitted = new Date().toISOString(); save();
    download();
    $('b-again').classList.remove('hidden');
    const box = $('sendinfo'); box.classList.remove('hidden');
    if (!CFG.upload_url) { box.innerHTML = L('e_dl')(contact()); return; }
    box.innerHTML = '<p class="muted">…</p>';
    fetch(CFG.upload_url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(state) })
      .then(() => { box.innerHTML = L('e_up_ok')(contact()); state.uploaded = new Date().toISOString(); save(); })
      .catch(() => { box.innerHTML = L('e_up_bad')(contact()); });
  };
  $('b-again').onclick = download;

  // ------------------------------------------------------------------ go
  applyLang();
  if (isPhone) show('s-mobile');
  window.__study = { state: () => state, cur: () => list[idx], T: T };      // for testing only
})();
</script>
</body>
